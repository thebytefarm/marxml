## marxml release config (knope.tech).
##
## Workflow:
##   1. Contributors add a `.changeset/*.md` file describing the change and a
##      semver bump (`patch` / `minor` / `major`). The `prepare-release` GH
##      Action aggregates pending changesets into a single "Release X.Y.Z" PR
##      that bumps both Cargo.toml + bindings/node/package.json in lockstep.
##   2. Merging that PR triggers `.github/workflows/release.yml`, which runs
##      version-sync → cross-compile → publish npm + crate, and then invokes
##      the `release` workflow below to tag `vX.Y.Z` as the final step. The
##      tag is created last so it only exists when artifacts actually shipped.

## Single-package mode — crate + npm package version are always in lockstep.
## Knope updates `[workspace.package].version` in the root Cargo.toml; member
## crates inherit via `version.workspace = true`. The 6 platform npm sub-
## packages under `bindings/node/npm/*` are rewritten by `napi version`
## during the tag-triggered publish workflow, so they don't need to be
## listed here.
[package]
versioned_files = ["Cargo.toml", "bindings/node/package.json"]
changelog = "CHANGELOG.md"

[github]
owner = "thebytefarm"
repo = "marxml"

## ─── Workflows ────────────────────────────────────────────────────────────

## Run by the `release-pr` GitHub Action on every push to `main`. Aggregates
## pending changesets, bumps versions, regenerates CHANGELOG, opens a PR.
## Idempotent — re-running on the same set of changesets updates the
## existing PR.
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git switch -c release/$version"
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Command"
command = "git add ."

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: release $version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release/$version"
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: release $version"
variables = { "$version" = "Version" }

[workflows.steps.body]
template = "Automated release PR generated by knope. Merging this PR triggers `.github/workflows/release.yml`:\n\n1. Version-sync gate\n2. Cross-compile napi bindings for 6 platforms\n3. Publish per-platform npm sub-packages + main npm package (with provenance)\n4. Publish crate to crates.io\n5. Tag commit as `v$version` (only on success — the tag is the receipt)\n\nSee CHANGELOG.md in the diff for what's included."
variables = { "$version" = "Version" }

## Invoked as the final step of `.github/workflows/release.yml`, after every
## publish step has succeeded. Reads the version from Cargo.toml, tags the
## commit `vX.Y.Z`, and pushes the tag. No further automation runs on the
## tag push — it's a receipt, not a trigger.
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"
