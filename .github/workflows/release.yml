name: Release

# Runs when the "chore: release X.Y.Z" PR opened by knope merges into main.
# Pipeline: version-sync gate → cross-compile matrix → publish (npm + crate)
# → tag. The tag is created last so `vX.Y.Z` only exists when artifacts
# actually shipped.
#
# Detection: knope's release PR is always titled `chore: release <ver>` and
# the squash/merge commit inherits that subject.

on:
  push:
    branches: [main]
  # Manual dispatch so we can re-trigger the pipeline against a release
  # commit already on `main` (e.g. after fixing a runner/image issue) without
  # going through another revert/re-merge cycle.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # OIDC for npm trusted publishing + provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  # ─── 1. Gate ──────────────────────────────────────────────────────────────
  version-sync:
    name: Version sync gate
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ') }}"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: ./scripts/check-versions.sh

  # ─── 2. Cross-compile matrix ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: version-sync
    strategy:
      fail-fast: false
      matrix:
        # Windows (`x86_64-pc-windows-msvc`) is temporarily disabled — the
        # `marxml-win32-x64-msvc` name reservation was blocked by npm spam
        # detection on first publish. Re-enable here + in
        # `bindings/node/package.json#napi.targets` once npm support unblocks
        # the name. Tracked in npm support ticket #4396187. See
        # contributing/release.md.
        #
        # Linux cross-compile mirrors the canonical napi-rs pattern
        # (napi-rs/package-template + rolldown):
        #   - glibc arm64 → `--use-napi-cross` (prebuilt sysroots from the
        #     napi-rs/cross-toolchain releases; no Docker)
        #   - musl        → `-x` (= cargo-zigbuild; zig-cc as the linker)
        # The older `--use-cross` (Docker via cross-rs) is deprecated for
        # napi-rs and was unreliable because of ghcr.io pull timeouts.
        include:
          # macOS: both targets build on Apple Silicon. rustup adds the x86_64
          # target and rustc cross-compiles natively. macos-13 (Intel x64
          # image) is being deprecated and routinely sits in the runner queue.
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm exec napi build --platform --release --target aarch64-apple-darwin --js-package-name marxml
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm exec napi build --platform --release --target x86_64-apple-darwin --js-package-name marxml
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm exec napi build --platform --release --target x86_64-unknown-linux-gnu --js-package-name marxml
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm exec napi build --platform --release --target x86_64-unknown-linux-musl --js-package-name marxml -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm exec napi build --platform --release --target aarch64-unknown-linux-gnu --js-package-name marxml --use-napi-cross
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # musl-only: zig provides the linker; cargo-zigbuild wraps cargo to
      # invoke zig-cc. SHA-pinned to match rolldown's supply-chain pattern.
      - name: Setup zig (musl only)
        if: ${{ contains(matrix.target, 'musl') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      - name: Install cargo-zigbuild (musl only)
        if: ${{ contains(matrix.target, 'musl') }}
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e # v2.79.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Build
        run: ${{ matrix.build }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/marxml.*.node
          if-no-files-found: error

  # ─── 3. Publish ──────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml
      # Trusted publishing requires npm >= 11.5.1; Node 22 LTS ships an older
      # npm 10.x. Upgrade in-place so `npm publish` can exchange the GH OIDC
      # token for a short-lived registry token.
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: bindings/node/artifacts
      - name: Move binaries into per-platform npm dirs
        run: pnpm exec napi artifacts
      - name: Update per-platform package versions
        run: pnpm exec napi version
      # `napi pre-publish` shells out to `npm publish` per sub-package and
      # inherits process.env, so NPM_CONFIG_PROVENANCE flips provenance on for
      # every platform package in one stroke. No NPM_TOKEN — auth is OIDC.
      - name: Publish per-platform packages
        run: pnpm exec napi pre-publish -t npm --skip-gh-release
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - name: Publish main npm package
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
      # crates.io trusted publishing: the auth action mints a short-lived
      # token via the same GH OIDC flow npm uses. No CARGO_REGISTRY_TOKEN
      # secret needed. Config is at https://crates.io/crates/marxml/settings.
      - name: Mint crates.io token (OIDC)
        uses: rust-lang/crates-io-auth-action@v1.0.4
        id: cargo-auth
      - name: Publish crates.io
        working-directory: .
        run: cargo publish -p marxml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}

  # ─── 4. Tag ───────────────────────────────────────────────────────────────
  # Runs only after publish succeeds. The tag is the receipt: if `vX.Y.Z`
  # exists, all artifacts shipped. If publish fails partway, no tag is
  # created — fix forward with another changeset, don't try to recover the
  # half-published version.
  tag:
    name: Tag release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # knope-dev/action@v2 is just an installer; invoke knope yourself.
      - name: Install knope
        uses: knope-dev/action@v2.1.2

      - name: Knope release (create tag)
        run: knope release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
