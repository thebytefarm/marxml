name: Release

# Runs when the "chore: release X.Y.Z" PR opened by knope merges into main.
# Pipeline: version-sync gate → cross-compile matrix → publish (npm + crate)
# → tag. The tag is created last so `vX.Y.Z` only exists when artifacts
# actually shipped.
#
# Detection: knope's release PR is always titled `chore: release <ver>` and
# the squash/merge commit inherits that subject.

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # for npm provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0

jobs:
  # ─── 1. Gate ──────────────────────────────────────────────────────────────
  version-sync:
    name: Version sync gate
    runs-on: ubuntu-latest
    if: "${{ startsWith(github.event.head_commit.message, 'chore: release ') }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/check-versions.sh

  # ─── 2. Cross-compile matrix ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: version-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-14
            target: aarch64-apple-darwin
          - host: macos-13
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (cross)
        if: matrix.use_cross
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} --js-package-name marxml --use-cross
      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} --js-package-name marxml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/marxml.*.node
          if-no-files-found: error

  # ─── 3. Publish ──────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
      - name: Move binaries into per-platform npm dirs
        run: pnpm exec napi artifacts
      - name: Update per-platform package versions
        run: pnpm exec napi version
      - name: Publish per-platform packages
        run: pnpm exec napi pre-publish -t npm --skip-gh-release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main npm package
        run: npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish crates.io
        working-directory: .
        run: cargo publish -p marxml --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  # ─── 4. Tag ───────────────────────────────────────────────────────────────
  # Runs only after publish succeeds. The tag is the receipt: if `vX.Y.Z`
  # exists, all artifacts shipped. If publish fails partway, no tag is
  # created — fix forward with another changeset, don't try to recover the
  # half-published version.
  tag:
    name: Tag release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Knope — release (create tag)
        uses: knope-dev/action@v2
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
