name: Release PR

# Opens (or updates) a "chore: release X.Y.Z" pull request whenever new
# changesets land on main. Merging that PR triggers `release.yml`, which
# publishes to npm + crates.io and then tags `vX.Y.Z` as the receipt.
#
# Manual dispatch with `prerelease: rc` produces `0.1.0-rc.0`-style versions
# instead of stable. Subsequent RC dispatches increment the suffix
# (`rc.0` → `rc.1` → …) until a stable release consumes the changesets.

on:
  # Run on every push to main. Knope short-circuits with a clean no-op when
  # `.changeset/*.md` is empty, so this isn't wasteful — and dropping a path
  # filter means a previously-orphaned changeset (e.g. left behind when a
  # release-pr run failed) gets picked up by the next docs/CI/refactor push
  # to main, instead of sitting there until someone touches the changeset
  # file itself.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Prerelease label (e.g. 'rc' for 0.1.0-rc.0). Leave blank for a stable release."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # knope needs full history to compute the bump

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Knope — prepare release (stable)
        if: ${{ inputs.prerelease == '' }}
        uses: knope-dev/action@v2.1.2
        with:
          command: prepare-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Knope — prepare release (${{ inputs.prerelease }} prerelease)
        if: ${{ inputs.prerelease != '' }}
        uses: knope-dev/action@v2.1.2
        with:
          command: prepare-release --prerelease-label ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
